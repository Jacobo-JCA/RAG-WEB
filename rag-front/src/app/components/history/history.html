<div class="history-container">
  <h2>Documentos subidos</h2>

  @if (cargando()) {
    <p class="estado">Cargando documentos...</p>
  }

  @if (!cargando && documentos.length === 0) {
    <p class="estado">No hay documentos subidos aún.</p>
  }

  @for (doc of documentos(); track doc.idDocument) {
    <div class="documento-card">
      <div class="doc-info">
        <span class="doc-nombre">📄 {{ doc.name }}</span>
        <span class="doc-meta">
          {{ doc.dateUploaded }} · {{ (doc.totalChunks / 1024).toFixed(1) }} KB
        </span>
      </div>
      <button class="btn-eliminar" (click)="eliminar(doc.idDocument)">
        Eliminar
      </button>
    </div>
  }
</div>
